{{- $suite := or .suite "bookworm" -}}
{{- $mcc_version := .mcc_version}}
{{- $version := or .version "12" -}}
{{- $outdir := or .outdir "images" -}}
{{- $image := or .image "debian" -}}

architecture: arm64

actions:

  - action: debootstrap
    suite: "{{ $suite }}"
    components:
      - main
    mirror: https://deb.debian.org/debian
    variant: minbase

  - action: recipe
    recipe: recipes/packages-common.yaml

  - action: recipe
    recipe: recipes/packages-{{ $suite }}.yaml

  - action: run
    chroot: true
    command: echo zynqmp > /etc/hostname

  - action: run
    chroot: true
    command: pip3 install gunicorn flask jsonschema Flask-JSON tabulate psutil --break-system-packages

  - action: run
    chroot: true
    command: systemctl enable supervisor

  - action: run
    chroot: true
    command: systemctl enable systemd-networkd

  - action: overlay
    source: overlays/daemon/{{ $mcc_version }}
    destination: /etc/supervisor/conf.d

  - action: overlay
    source: overlays/environment/{{ $mcc_version }}
    destination: /etc

  - action: overlay
    source: overlays/boot
    destination: /boot

  - action: overlay
    source: overlays/etc
    destination: /etc

  - action: run
    chroot: true
    script: scripts/untar-modules.sh

  - action: run
    chroot: false
    script: scripts/install-libtooldaq.sh {{ $version }}

  - action: run
    chroot: true
    script: scripts/install-mccctl.sh

  - action: run
    chroot: true
    script: scripts/install-mccws.sh

  - action: run
    chroot: true
    script: scripts/install-xvc-adaptive.sh

  - action: overlay
    source: overlays/sshd
    destination: /etc/ssh

  - action: overlay
    source: overlays/rc-local/{{ $mcc_version }}
    destination: /etc

  - action: overlay
    source: overlays/bash/bash_profile
    destination: /root/.bash_profile

  - action: overlay
    source: overlays/vim/vimrc
    destination: /root/.vimrc

  - action: overlay
    source: overlays/network
    destination: /etc/network/interfaces.d

  - action: overlay
    source: overlays/supervisord
    destination: /lib/systemd/system

  - action: overlay
    source: overlays/systemd-networkd/{{ $mcc_version }}
    destination: /etc/systemd

  - action: overlay
    source: overlays/systemd-system
    destination: /etc/systemd

  - action: overlay
    source: overlays/staging
    destination: /

  - action: run
    chroot: true
    command: systemctl enable set-bridge-mac

  - action: run
    chroot: true
    command: systemctl enable rc-local.service

  - action: run
    chroot: true
    command: systemctl enable mcc-producer.service

  - action: run
    chroot: true
    command: systemctl enable mcc-ws.service

  - action: overlay
    source: overlays/fixes
    destination: /

  - action: overlay
    source: overlays/brmac
    destination: /usr/bin

  - action: run
    chroot: true
    command: echo "en_US.UTF-8 UTF-8" > /etc/locale.gen; /usr/sbin/locale-gen; /usr/sbin/update-locale LANG=en_US.UTF-8

  - action: run
    chroot: true
    command: echo 'root:$1$TzpfaNEc$tjqCamkIJFUytJokydS8w.' | /usr/sbin/chpasswd -e

  - action: run
    chroot: true
    script: scripts/optimize-boot.sh

  - action: image-partition
    imagename: "{{ $outdir }}/{{ $image }}" 
    imagesize: 3.0GB
    partitiontype: msdos
    mountpoints:
      - mountpoint: /
        partition: rootfs
    partitions:
      - name: rootfs
        features: ["^orphan_file"]
        fs: ext4
        start: 0%
        end: 100%

  - action: filesystem-deploy
    description: Deploying filesystem onto image

  - action: pack
    compression: none
    file: {{ $outdir }}/zynqmp-mcc{{ $mcc_version }}-debian-{{ $suite }}.tar

  - action: pack
    compression: gz
    file: {{ $outdir }}/zynqmp-mcc{{ $mcc_version }}-debian-{{ $suite }}.tar.gz

  - action: run
    chroot: false
    label: lz4
    command: lz4 -f --favor-decSpeed {{ $outdir }}/zynqmp-mcc{{ $mcc_version }}-debian-{{ $suite }}.tar {{ $outdir }}/zynqmp-mcc{{ $mcc_version }}-debian-{{ $suite }}.tar.lz4

